name: throw_app
description: "Offline file and text sharing."
publish_to: "none"
version: 1.0.10+10

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # Core transfer stack
  nearby_connections: ^4.3.0 # Android only (WiFi Direct, ~250 Mbps)
  bluetooth_low_energy: ^6.2.1 # Desktop + Android fallback (BLE)
  file_picker: ^8.1.2
  permission_handler: ^11.0.0
  open_file: ^3.3.2
  receive_sharing_intent: ^1.8.0 # Android only
  path_provider: ^2.1.0
  provider: ^6.1.0

  # UI & animation
  flutter_animate: ^4.5.0
  animations: ^2.0.11
  lottie: ^3.1.0
  skeletonizer: ^1.4.0
  flutter_slidable: ^3.1.0
  google_fonts: ^6.2.1

  # Responsive & adaptive
  flutter_adaptive_scaffold: ^0.1.9 # Google's official adaptive scaffold
  window_manager: ^0.3.8 # Desktop window control
  flutter_window_close: ^0.2.2 # Graceful desktop exit

  # Utilities
  url_launcher: ^6.3.2
  device_info_plus: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0
  msix: ^3.16.7 # Windows MSIX packaging

flutter:
  generate: true # enables flutter gen-l10n
  uses-material-design: true

  # Bundled so the offline app never fetches fonts at runtime.
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-wght.ttf

  assets:
    - assets/logo.png
    - assets/logo_foreground.png
    - assets/animations/

flutter_launcher_icons:
  android: true
  ios: false
  windows:
    generate: true
    image_path: assets/logo.png
    icon_size: 48
  linux:
    generate: true
    image_path: assets/logo.png
  image_path: assets/logo.png
  adaptive_icon_background: "#14171F"
  adaptive_icon_foreground: assets/logo_foreground.png
  min_sdk_android: 21

flutter_native_splash:
  color: "#14171F"
  image: assets/logo.png
  android_12:
    image: assets/logo.png
    icon_background_color: "#14171F"
  fullscreen: true
  android: true
  ios: false
  web: false

msix_config:
  display_name: Throw
  publisher_display_name: Md. Mazidul Islam Mahim
  identity_name: com.mahimmazidul.throw
  publisher: CN=mahimmazidul
  logo_path: assets/logo.png
