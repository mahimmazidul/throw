name: throw_app
description: "Offline file and text sharing."
publish_to: "none"
version: 1.1.0+16

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # Core transfer stack
  nearby_connections: ^4.3.0 # Android only (WiFi Direct, ~250 Mbps)
  bluetooth_low_energy: ^6.2.1 # Desktop + Android fallback (BLE)
  file_picker: ^8.1.2
  permission_handler: ^11.0.0
  open_file: ^3.3.2
  receive_sharing_intent: ^1.8.0 # Android only
  path_provider: ^2.1.0
  provider: ^6.1.0
  shared_preferences: ^2.3.0 # language, theme, device name survive relaunch

  # Utilities
  url_launcher: ^6.3.2
  device_info_plus: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0
  msix: ^3.16.7 # Windows MSIX packaging

flutter:
  generate: true # enables flutter gen-l10n
  uses-material-design: true

  # Bundled so the offline app never fetches fonts at runtime.
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-wght.ttf

      # Latin-only. Declared so Bangla text has an in-app fallback instead of
      # relying on whatever the host OS ships — Windows and Linux give no
      # guarantee, and Plus Jakarta Sans has no Bengali glyphs at all.
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Light.ttf
          weight: 300
        - asset: assets/fonts/HindSiliguri-Regular.ttf
          weight: 400
        - asset: assets/fonts/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri-Bold.ttf
          weight: 700

  assets:
    - assets/logo.png
    - assets/logo_foreground.png
    - assets/animations/

flutter_launcher_icons:
  android: true
  ios: false
  windows:
    generate: true
    image_path: assets/logo.png
    icon_size: 48
  linux:
    generate: true
    image_path: assets/logo.png
  image_path: assets/logo.png
  adaptive_icon_background: "#0A1214"   # new deep-water surface (was #14171F)
  adaptive_icon_foreground: assets/logo_foreground.png
  min_sdk_android: 21

flutter_native_splash:
  color: "#14171F"
  image: assets/logo.png
  android_12:
    image: assets/logo.png
    icon_background_color: "#14171F"
  fullscreen: true
  android: true
  ios: false
  web: false

msix_config:
  display_name: Throw
  publisher_display_name: Md. Mazidul Islam Mahim
  identity_name: com.mahimmazidul.throw
  publisher: CN=mahimmazidul
  logo_path: assets/logo.png
