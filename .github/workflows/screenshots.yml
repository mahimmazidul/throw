name: Update Screenshots

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Fonts: the test harness now registers the bundled Plus Jakarta Sans,
      # HindSiliguri and the SDK's MaterialIcons through FLUTTER_ROOT. Without
      # that step the regenerated PNGs are white canvases full of tofu boxes —
      # which is what this workflow used to commit to main.
      - name: Regenerate screenshots
        env:
          FLUTTER_ROOT: ${{ env.FLUTTER_ROOT }}
        run: >-
          flutter test --update-goldens
          --dart-define=THROW_COMPARE_SCREENSHOTS=true
          test/screenshots_test.dart

      - name: Commit and push screenshot updates
        run: |
          if git diff --quiet -- assets/screenshots; then
            echo "No screenshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshots
          git commit -m "docs: update app screenshots [skip ci]"
          git push origin HEAD:main
