name: CD

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true


      - run: flutter pub get
      - run: flutter gen-l10n

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | \
            base64 --decode > android/app/keystore.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF

      - run: >-
          flutter build apk
          --release
          --split-per-abi

      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab

  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true


      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter config --enable-windows-desktop
      - run: flutter build windows --release
      - run: dart run msix:create --install-certificate false

      - name: Zip Windows build
        run: |
          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath throw-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            build/windows/x64/runner/Release/*.msix
            throw-windows-x64.zip

  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            libbluetooth-dev \
            libdbus-1-dev \
            dpkg-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true


      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter config --enable-linux-desktop
      - run: flutter build linux --release

      - name: Package tar.gz
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../throw-linux-x64.tar.gz .

      - name: Package .deb
        run: |
          mkdir -p throw-deb/usr/lib/throw
          mkdir -p throw-deb/usr/share/applications
          mkdir -p throw-deb/usr/share/icons/hicolor/256x256/apps
          mkdir -p throw-deb/DEBIAN

          cp -r build/linux/x64/release/bundle/* throw-deb/usr/lib/throw/

          cat > throw-deb/DEBIAN/control << EOF
          Package: throw-app
          Version: ${GITHUB_REF_NAME#v}
          Architecture: amd64
          Maintainer: Md. Mazidul Islam Mahim <mahimmazidul@gmail.com>
          Depends: libbluetooth3, libdbus-1-3
          Description: Throw - offline file and text sharing
           Send files and text directly between devices.
           Android, Windows, Linux.
          EOF

          cat > throw-deb/usr/share/applications/throw.desktop << EOF
          [Desktop Entry]
          Name=Throw
          Comment=Offline file sharing
          Exec=/usr/lib/throw/throw
          Icon=throw
          Terminal=false
          Type=Application
          Categories=Network;FileTransfer;
          Keywords=share;file;bluetooth;nearby;
          EOF

          cp assets/logo.png throw-deb/usr/share/icons/hicolor/256x256/apps/throw.png

          dpkg-deb --build throw-deb throw-linux-amd64.deb

      - name: Package AppImage
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          mkdir -p ThrowApp.AppDir/usr/bin
          cp -r build/linux/x64/release/bundle/* ThrowApp.AppDir/usr/bin/

          cat > ThrowApp.AppDir/throw.desktop << EOF
          [Desktop Entry]
          Name=Throw
          Exec=throw
          Icon=throw
          Type=Application
          Categories=Network;
          EOF

          cp assets/logo.png ThrowApp.AppDir/throw.png

          cat > ThrowApp.AppDir/AppRun << 'EOF'
          #!/bin/bash
          exec "$(dirname "$0")/usr/bin/throw" "$@"
          EOF
          chmod +x ThrowApp.AppDir/AppRun

          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 \
            ./appimagetool-x86_64.AppImage ThrowApp.AppDir throw-linux-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            throw-linux-x64.tar.gz
            throw-linux-amd64.deb
            throw-linux-x86_64.AppImage

  release:
    name: Create Release
    needs: [build-android, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: android-build
          path: release-files/android

      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release-files/windows

      - uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: release-files/linux

      - uses: ncipollo/release-action@v1
        with:
          artifacts: "release-files/**/*"
          tag: ${{ github.ref_name }}
          name: "Throw ${{ github.ref_name }}"
          bodyFile: "CHANGELOG.md"
          token: ${{ secrets.GITHUB_TOKEN }}

  update-pages:
    name: Update Pages Links
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release download links in docs
        run: |
          TAG="${{ github.ref_name }}"
          python3 - <<'PY'
          import os, re, pathlib
          tag=os.environ['TAG']
          p=pathlib.Path('docs/index.html')
          s=p.read_text()
          block=f"""<!-- RELEASE_LINKS_START -->
                <div class="dl-grid" data-release="{tag}">
                  <div class="dl-card">
                    <h3>Android</h3>
                    <div class="ver">{tag}</div>
                    <div class="dl-links">
                      <a class="dl-link" href="https://github.com/mahimmazidul/throw/releases/download/{tag}/app-arm64-v8a-release.apk"><span>ARM64 APK</span><small>.apk</small></a>
                      <a class="dl-link" href="https://github.com/mahimmazidul/throw/releases/download/{tag}/app-armeabi-v7a-release.apk"><span>ARM32 APK</span><small>.apk</small></a>
                      <a class="dl-link" href="https://github.com/mahimmazidul/throw/releases/download/{tag}/app-x86_64-release.apk"><span>x86_64 APK</span><small>.apk</small></a>
                      <a class="dl-link" href="https://github.com/mahimmazidul/throw/releases/download/{tag}/app-release.aab"><span>Android App Bundle</span><small>.aab</small></a>
                    </div>
                  </div>
                  <div class="dl-card">
                    <h3>Windows</h3>
                    <div class="ver">{tag}</div>
                    <div class="dl-links">
                      <a class="dl-link" href="https://github.com/mahimmazidul/throw/releases/download/{tag}/throw-windows-x64.zip"><span>Windows ZIP</span><small>.zip</small></a>
                      <a class="dl-link" href="https://github.com/mahimmazidul/throw/releases/download/{tag}/throw_app.msix"><span>Windows MSIX</span><small>.msix</small></a>
                    </div>
                  </div>
                  <div class="dl-card">
                    <h3>Linux</h3>
                    <div class="ver">{tag}</div>
                    <div class="dl-links">
                      <a class="dl-link" href="https://github.com/mahimmazidul/throw/releases/download/{tag}/throw-linux-amd64.deb"><span>Debian/Ubuntu</span><small>.deb</small></a>
                      <a class="dl-link" href="https://github.com/mahimmazidul/throw/releases/download/{tag}/throw-linux-x86_64.AppImage"><span>AppImage</span><small>.AppImage</small></a>
                      <a class="dl-link" href="https://github.com/mahimmazidul/throw/releases/download/{tag}/throw-linux-x64.tar.gz"><span>Tarball</span><small>.tar.gz</small></a>
                    </div>
                  </div>
                </div>
                <!-- RELEASE_LINKS_END -->"""
          s=re.sub(r'<!-- RELEASE_LINKS_START -->.*?<!-- RELEASE_LINKS_END -->', block, s, flags=re.S)
          s=re.sub(r'Latest: v[0-9]+\.[0-9]+\.[0-9]+', f'Latest: {tag}', s)
          p.write_text(s)
          print('updated', tag)
          PY
        env:
          TAG: ${{ github.ref_name }}

      - name: Commit and push docs update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --staged --quiet; then
            echo "No docs changes"
            exit 0
          fi
          git commit -m "docs: update download links for ${{ github.ref_name }}"
          git push origin HEAD:main
