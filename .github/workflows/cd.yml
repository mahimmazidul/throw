name: CD

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v1.0.10)'
        required: true
        type: string

concurrency:
  group: cd-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true


      - run: flutter pub get
      - run: flutter gen-l10n

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | \
            base64 --decode > android/app/keystore.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF

      - run: >-
          flutter build apk
          --release
          --split-per-abi

      - run: flutter build appbundle --release

      - name: Rename Android artifacts
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p dist/android
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/android/Throw-${TAG}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/android/Throw-${TAG}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "dist/android/Throw-${TAG}-x86_64.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/android/Throw-${TAG}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: dist/android/*

  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true


      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter config --enable-windows-desktop
      - run: flutter build windows --release
      - run: dart run msix:create --install-certificate false

      - name: Package Windows artifacts
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "dist/windows/Throw-$tag-windows-x64.zip"
          $msix = Get-ChildItem build/windows/x64/runner/Release/*.msix | Select-Object -First 1
          if ($msix) { Copy-Item $msix.FullName "dist/windows/Throw-$tag-windows.msix" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/windows/*

  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            libbluetooth-dev \
            libdbus-1-dev \
            dpkg-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true


      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter config --enable-linux-desktop
      - run: flutter build linux --release

      - name: Package Linux artifacts
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          mkdir -p dist/linux

          cd build/linux/x64/release/bundle
          tar -czf "../../../../../dist/linux/Throw-${TAG}-linux-x64.tar.gz" .
          cd ../../../../../

          mkdir -p throw-deb/usr/lib/throw
          mkdir -p throw-deb/usr/share/applications
          mkdir -p throw-deb/usr/share/icons/hicolor/256x256/apps
          mkdir -p throw-deb/DEBIAN

          cp -r build/linux/x64/release/bundle/* throw-deb/usr/lib/throw/

          cat > throw-deb/DEBIAN/control << EOF
          Package: throw-app
          Version: ${VERSION}
          Architecture: amd64
          Maintainer: Md. Mazidul Islam Mahim <mahimmazidul@gmail.com>
          Depends: libbluetooth3, libdbus-1-3
          Description: Throw - offline file and text sharing
           Send files and text directly between devices.
           Android, Windows, Linux.
          EOF

          cat > throw-deb/usr/share/applications/throw.desktop << EOF
          [Desktop Entry]
          Name=Throw
          Comment=Offline file sharing
          Exec=/usr/lib/throw/throw
          Icon=throw
          Terminal=false
          Type=Application
          Categories=Network;FileTransfer;
          Keywords=share;file;bluetooth;nearby;
          EOF

          cp assets/logo.png throw-deb/usr/share/icons/hicolor/256x256/apps/throw.png
          dpkg-deb --build throw-deb "dist/linux/Throw-${TAG}-linux-amd64.deb"

          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          mkdir -p ThrowApp.AppDir/usr/bin
          cp -r build/linux/x64/release/bundle/* ThrowApp.AppDir/usr/bin/

          cat > ThrowApp.AppDir/throw.desktop << EOF
          [Desktop Entry]
          Name=Throw
          Exec=throw
          Icon=throw
          Type=Application
          Categories=Network;
          EOF

          cp assets/logo.png ThrowApp.AppDir/throw.png

          cat > ThrowApp.AppDir/AppRun << 'EOF'
          #!/bin/bash
          exec "$(dirname "$0")/usr/bin/throw" "$@"
          EOF
          chmod +x ThrowApp.AppDir/AppRun

          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 \
            ./appimagetool-x86_64.AppImage ThrowApp.AppDir "dist/linux/Throw-${TAG}-linux-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/linux/*

  release:
    name: Create Release
    needs: [build-android, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: android-build
          path: release-files/android

      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release-files/windows

      - uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: release-files/linux

      # `allowUpdates` + `replacesArtifacts: false` make this step idempotent.
      #
      # v1.3.2 failed here: the tag was pushed, the release was created, and
      # then the asset uploads died on `Error 502: Server Error` from the
      # releases API. The release existed with zero assets, and the run was
      # marked failed even though every build had succeeded. Re-running the job
      # then failed differently, because the release already existed. Both
      # outcomes are survivable now: publishing an existing release updates it
      # in place, and the retry settings ride out a transient 5xx.
      - uses: ncipollo/release-action@v1
        id: release
        with:
          retry-attempts: 5
          retry-wait: 5000
          artifacts: "release-files/**/*"
          tag: ${{ github.event.inputs.tag || github.ref_name }}
          name: "Throw ${{ github.event.inputs.tag || github.ref_name }}"
          bodyFile: "CHANGELOG.md"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: false

      # A missing asset is worse than a red build: users download nothing.
      # This asserts the release actually carries every artifact, so a silent
      # partial release cannot ship again.
      - name: Verify every artifact was published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          expected=$(find release-files -type f \( -name '*.apk' -o -name '*.aab' \
            -o -name '*.deb' -o -name '*.tar.gz' -o -name '*.AppImage' \
            -o -name '*.zip' -o -name '*.msix' \) | wc -l)
          published=$(gh release view "$TAG" --json assets --jq '.assets | length')
          echo "built: $expected, published: $published"
          if [ "$expected" -ne "$published" ]; then
            echo "::error::Release $TAG has $published assets but $expected were built"
            gh release view "$TAG" --json assets --jq '.assets[].name'
            exit 1
          fi
          echo "all $expected assets published"

  update-pages:
    name: Update Pages Links
    needs: [release]
    # v1.3.2 skipped this job because `release` failed, leaving the site one
    # version behind. A skipped link update is invisible but real, so this job
    # now runs whenever the release itself succeeded - including after retries.
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      # The site is a single prebuilt bundle in docs/, so tags are rewritten in
      # place rather than rebuilt (the web source does not live in this repo).
      # Every release swaps whatever version the site currently shows for this
      # one — the release pill, the per-row asset URLs and the Throw-<tag>-*
      # filenames all carry the same v*.*.* string, so one replace covers them.
      - name: Update release tag across the site
        run: |
          python3 - <<'PY'
          import os, re, pathlib

          tag = os.environ["TAG"].strip()
          if not tag.startswith("v"):
              tag = "v" + tag
          pattern = re.compile(r"v\d+\.\d+\.\d+")

          changed = []
          for rel in ("docs/index.html", "README.md"):
              p = pathlib.Path(rel)
              if not p.exists():
                  continue
              s = p.read_text(encoding="utf-8")
              found = sorted(set(pattern.findall(s)))
              new = s
              for old in found:
                  if old != tag:
                      new = new.replace(old, tag)
              if new != s:
                  p.write_text(new, encoding="utf-8")
                  changed.append(f"{rel}: {found} -> {tag}")

          if changed:
              print("updated: " + "; ".join(changed))
          else:
              print(f"site already points at {tag}; nothing to rewrite")
          PY
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Commit and push docs update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html README.md
          if git diff --staged --quiet; then
            echo "No docs changes"
            exit 0
          fi
          git commit -m "docs: update download links for ${{ github.event.inputs.tag || github.ref_name }}"
          git push origin HEAD:main
