<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Throw — Throw anything to anyone nearby</title>
    <meta
      name="description"
      content="Throw is an offline file and text sharing app for Android, Windows, and Linux. Files move directly between devices over WiFi Direct or Bluetooth. The transfer never passes through a server."
    />
    <meta name="theme-color" content="#06060c" />
    <meta property="og:title" content="Throw — Throw anything to anyone nearby" />
    <meta
      property="og:description"
      content="Offline file and text sharing for Android, Windows and Linux. WiFi Direct and Bluetooth, never a server."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://mahimmazidul.github.io/throw/social_preview.png" />
    <link rel="icon" type="image/png" href="throw-icon.png" />

    <!-- apply the saved theme before first paint to avoid a flash -->
    <script>
      (function () {
        var t = "dark";
        try {
          var s = localStorage.getItem("throw-theme");
          if (s === "light" || s === "dark") t = s;
        } catch (e) {}
        var el = document.documentElement;
        el.setAttribute("data-theme", t);
        el.style.colorScheme = t;
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
